{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
# Backend credentials for the engine + config-service (Redis password, etcd
# RBAC user/pass). Created only when auth is on and no existingSecret is given —
# in production prefer an externally-managed Secret via auth.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "govelox.fullname" . }}-auth
  labels:
    {{- include "govelox.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.auth.redisPassword | quote }}
  ETCD_USERNAME:  {{ .Values.auth.etcdUsername | quote }}
  ETCD_PASSWORD:  {{ .Values.auth.etcdPassword | quote }}
{{- end }}
